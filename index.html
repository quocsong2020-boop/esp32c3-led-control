<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP32-C3 LED BLE</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#101827;color:#f4f7fc;margin:0;padding:20px}.app{max-width:430px;margin:20px auto;background:#1c293c;border-radius:22px;padding:24px;box-shadow:0 12px 35px #0005}h1{font-size:23px;margin:0 0 5px}p{color:#b6c3d4}.status{padding:13px;border-radius:12px;background:#29394e;margin:16px 0}.display{text-align:center;padding:26px;background:#26374d;border-radius:17px;margin:18px 0}.value{font-size:60px;font-weight:750}button{font-size:17px;font-weight:650;border:0;border-radius:12px;padding:15px 9px;color:white;background:#3567ba;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.connect{width:100%;background:#148a71}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.levels button{font-size:14px;padding:14px 1px}.levels button.active{background:#12a7bb;outline:2px solid #a5f5ff}.hint{font-size:13px;line-height:1.5}#msg{min-height:22px;color:#fbbf77}</style></head><body><main class="app"><h1>💡 ESP32-C3 LED Control</h1><p>Điều khiển PWM 10 kHz qua Bluetooth BLE</p><button id="connect" class="connect">🔵 Kết nối Bluetooth</button><div class="status" id="state">Chưa kết nối</div><div class="display"><div>Độ sáng LED</div><div class="value" id="percent">--%</div><div id="power">Trạng thái: --</div></div><div class="controls"><button class="cmd" data-command="TOGGLE" disabled>⏻ ON / OFF</button><button class="cmd" data-command="NEXT" disabled>⏭ NEXT</button></div><div class="levels"><button class="cmd" data-command="L0" disabled>0%</button><button class="cmd" data-command="L1" disabled>5%</button><button class="cmd" data-command="L2" disabled>10%</button><button class="cmd" data-command="L3" disabled>25%</button><button class="cmd" data-command="L4" disabled>90%</button></div><p id="msg" role="status"></p><p class="hint">Trên iPhone: mở trang HTTPS này bằng Bluefy (không dùng Safari). Cho phép Bluetooth khi được hỏi. Thiết bị: ESP32C3-LED. Tương thích tùy phiên bản Bluefy/iOS.</p></main>
<script>
const SERVICE='8b26a100-6df1-4c0b-9a28-0c8f98a30001';
const COMMAND='8b26a100-6df1-4c0b-9a28-0c8f98a30002';
const STATUS='8b26a100-6df1-4c0b-9a28-0c8f98a30003';
let device=null,command=null,statusCharacteristic=null;
const $=id=>document.getElementById(id);
const cmdButtons=[...document.querySelectorAll('.cmd')];
function setConnected(yes){cmdButtons.forEach(b=>b.disabled=!yes);$('state').textContent=yes?'🟢 Đã kết nối ESP32C3-LED':'⚪ Chưa kết nối';$('connect').textContent=yes?'🔄 Kết nối lại':'🔵 Kết nối Bluetooth';if(!yes){command=null;statusCharacteristic=null;}}
function update(raw){const s=raw.trim();const level=/LEVEL=(\d+)/.exec(s),pwm=/PWM=(\d+)/.exec(s),on=/ON=(\d+)/.exec(s);if(!pwm||!on)return;$('percent').textContent=(on[1]==='1'?pwm[1]:'0')+'%';$('power').textContent=on[1]==='1'?'Trạng thái: BẬT':'Trạng thái: TẮT';document.querySelectorAll('.levels button').forEach(b=>b.classList.toggle('active',on[1]==='1'&&level&&b.dataset.command==='L'+level[1]));}
function decode(value){return new TextDecoder().decode(value)}
function onStatus(e){update(decode(e.target.value))}
$('connect').addEventListener('click',async()=>{if(!navigator.bluetooth){$('msg').textContent='Trình duyệt này không hỗ trợ Web Bluetooth. Hãy dùng Bluefy trên iPhone và mở trang HTTPS.';return;}try{$('msg').textContent='Đang tìm thiết bị…';if(!device){device=await navigator.bluetooth.requestDevice({filters:[{name:'ESP32C3-LED'}],optionalServices:[SERVICE]});device.addEventListener('gattserverdisconnected',()=>{setConnected(false);$('msg').textContent='Đã ngắt kết nối.'})}const server=await device.gatt.connect();const service=await server.getPrimaryService(SERVICE);command=await service.getCharacteristic(COMMAND);statusCharacteristic=await service.getCharacteristic(STATUS);await statusCharacteristic.startNotifications();statusCharacteristic.addEventListener('characteristicvaluechanged',onStatus);update(decode(await statusCharacteristic.readValue()));setConnected(true);$('msg').textContent='Kết nối thành công.';}catch(e){setConnected(false);$('msg').textContent='Không kết nối được: '+e.message;}});
let busy=false;
cmdButtons.forEach(b=>b.addEventListener('click',async()=>{if(!command||busy)return;busy=true;try{const data=new TextEncoder().encode(b.dataset.command);if(command.properties.write){await command.writeValueWithResponse(data);}else{await command.writeValueWithoutResponse(data);}$('msg').textContent='Đã gửi '+b.dataset.command;}catch(e){$('msg').textContent='Lỗi gửi lệnh: '+e.message;}finally{busy=false;}}));
</script></body></html>
